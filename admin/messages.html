<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Admin</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <style>
    .messages-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      height: calc(100vh - 140px);
      min-height: 500px;
    }
    
    @media (max-width: 768px) {
      .messages-layout {
        grid-template-columns: 1fr;
      }
      .conversations-list {
        display: block !important;
      }
      .chat-area {
        display: none !important;
      }
      .chat-area--active {
        display: flex !important;
      }
      .conversations-list--hidden {
        display: none !important;
      }
    }
    
    .conversations-list {
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
    }
    
    .conversations-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg-soft);
    }
    
    .conversations-header h2 {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 500;
    }
    
    .conversation-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--color-border);
      transition: background 0.3s;
      position: relative;
    }
    
    .conversation-item:hover {
      background: var(--color-bg-soft);
    }
    
    .conversation-item--active {
      background: rgba(212, 165, 165, 0.1);
    }
    
    .conversation-item--unread::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 40px;
      background: var(--color-rose);
    }
    
    .conversation-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--color-bg-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .conversation-avatar svg {
      width: 20px;
      height: 20px;
      color: var(--color-text-secondary);
    }
    
    .conversation-info {
      flex: 1;
      min-width: 0;
    }
    
    .conversation-name {
      font-weight: 500;
      font-size: 15px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .conversation-preview {
      font-size: 13px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .conversation-preview--unread {
      color: var(--color-text);
      font-weight: 500;
    }
    
    .conversation-meta {
      text-align: right;
      flex-shrink: 0;
    }
    
    .conversation-time {
      font-size: 12px;
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }
    
    .conversation-badge {
      display: inline-flex;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      background: var(--color-rose);
      color: white;
      font-size: 11px;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
    }
    
    .chat-area {
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
    }
    
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg-soft);
    }
    
    .chat-header__user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .chat-header__name {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 500;
    }
    
    .chat-header__email {
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    
    .chat-header__back {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
    }
    
    @media (max-width: 768px) {
      .chat-header__back {
        display: block;
      }
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .chat-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--color-text-secondary);
      text-align: center;
      padding: 40px;
    }
    
    .chat-empty svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      color: var(--color-border);
    }
    
    .admin-message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.5;
    }
    
    .admin-message--sent {
      align-self: flex-end;
      background: var(--color-rose);
      color: white;
    }
    
    .admin-message--received {
      align-self: flex-start;
      background: var(--color-bg-soft);
      color: var(--color-text);
    }
    
    .admin-message__time {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 4px;
    }
    
    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--color-border);
      background: var(--color-bg);
    }
    
    .chat-input-form {
      display: flex;
      gap: 12px;
    }
    
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    
    .chat-input:focus {
      border-color: var(--color-rose);
    }
    
    .chat-send {
      width: 44px;
      height: 44px;
      background: var(--color-rose);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .chat-send svg {
      width: 20px;
      height: 20px;
    }
    
    .no-conversation-selected {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--color-text-secondary);
    }
    
    .no-conversation-selected svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <button class="admin-sidebar__toggle" id="sidebar-toggle">
        <i data-lucide="menu"></i>
      </button>
      <div class="admin-sidebar__logo">Admin</div>
      <nav class="admin-sidebar__nav">
        <a href="/admin/" class="admin-sidebar__link">
          <i data-lucide="layout-dashboard"></i>
          <span>Tableau de bord</span>
        </a>
        <a href="/admin/products.html" class="admin-sidebar__link">
          <i data-lucide="package"></i>
          <span>Produits</span>
        </a>
        <a href="/admin/orders.html" class="admin-sidebar__link">
          <i data-lucide="shopping-cart"></i>
          <span>Commandes</span>
        </a>
        <a href="/admin/customers.html" class="admin-sidebar__link">
          <i data-lucide="users"></i>
          <span>Clients</span>
        </a>
        <a href="/admin/messages.html" class="admin-sidebar__link admin-sidebar__link--active">
          <i data-lucide="message-circle"></i>
          <span>Messages</span>
          <span class="admin-sidebar__badge" id="sidebar-unread-badge" style="display: none; margin-left: auto; background: var(--color-rose); color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px;">0</span>
        </a>
        <a href="/admin/settings.html" class="admin-sidebar__link">
          <i data-lucide="settings"></i>
          <span>Paramètres</span>
        </a>
        <a href="/" class="admin-sidebar__link" style="margin-top: auto;">
          <i data-lucide="arrow-left"></i>
          <span>Retour au site</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <h1 class="admin-header__title">Messages</h1>
      </div>

      <div class="messages-layout">
        <!-- Conversations List -->
        <div class="conversations-list" id="conversations-list">
          <div class="conversations-header">
            <h2>Conversations</h2>
          </div>
          <div id="conversations-container">
            <!-- Conversations loaded dynamically -->
          </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chat-area">
          <div class="no-conversation-selected" id="no-conversation">
            <i data-lucide="message-circle"></i>
            <p>Sélectionnez une conversation pour commencer</p>
          </div>
          
          <div id="active-chat" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
              <div style="display: flex; align-items: center; gap: 12px;">
                <button class="chat-header__back" id="back-to-conversations">
                  <i data-lucide="arrow-left"></i>
                </button>
                <div class="chat-header__user">
                  <div class="conversation-avatar">
                    <i data-lucide="user"></i>
                  </div>
                  <div>
                    <div class="chat-header__name" id="chat-user-name">Client</div>
                    <div class="chat-header__email" id="chat-user-email"></div>
                  </div>
                </div>
              </div>
              <a href="#" id="view-orders-link" class="admin-btn admin-btn--secondary" style="font-size: 13px;">
                Voir commandes
              </a>
            </div>
            
            <div class="chat-messages" id="chat-messages">
              <!-- Messages loaded dynamically -->
            </div>
            
            <div class="chat-input-area">
              <form class="chat-input-form" id="chat-form">
                <input type="text" class="chat-input" id="chat-input" placeholder="Écrivez votre réponse..." autocomplete="off">
                <button type="submit" class="chat-send">
                  <i data-lucide="send"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container"></div>

  <!-- Scripts -->
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/admin/messages.js"></script>
  <script>
    lucide.createIcons();
    
    // Mobile sidebar toggle
    const sidebar = document.querySelector('.admin-sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    
    sidebarToggle?.addEventListener('click', () => {
      sidebar?.classList.toggle('admin-sidebar--open');
    });
  </script>
</body>
</html>
